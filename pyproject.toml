[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mht-experiments"  # choose any name; doesn't have to match the folder name
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
  "stonesoup[mfa]==1.9.1",
  "numpy==2.2.6; python_version < '3.12'",
  "numpy==2.4.5; python_version >= '3.12'",
  "scipy==1.15.3; python_version < '3.12'",
  "scipy==1.17.1; python_version >= '3.12'",
  "matplotlib==3.10.9",
  "ordered-set==4.1.0",
  "ortools==9.15.6755",
]

[project.optional-dependencies]
dev = [
  "black==26.5.1",
  "flake8==7.3.0",
  "Flake8-pyproject==1.2.4",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "snakeviz==2.2.2",
  "nbformat==5.11.0",
  "pandas-stubs==2.3.3.260113",
  "types-defusedxml==0.7.0.20260504",
  "types-openpyxl==3.1.5.20260724",
  "types-python-dateutil==2.9.0.20260716",
  "types-xlrd==2.0.0.20260518",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mht*"]

[tool.black]
target-version = ['py310']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.flake8]
max-line-length = 88
# E203: whitespace before ':'
# E501: line too long
# E741: ambigous variable name 'I', 'O' or 'l'
# W503: line break before binary operator
extend-ignore = ['E203', 'E501', 'E741', 'W503']
exclude = [".git", "venv", ".venv*", "build"]

[tool.mypy]
python_version = "3.10"
warn_unreachable = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "scipy.*", "stonesoup.*"]
ignore_missing_imports = true
