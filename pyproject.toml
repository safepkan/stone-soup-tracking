[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mht-experiments"  # choose any name; doesn't have to match the folder name
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "stonesoup[mfa]==1.8",
  "numpy==2.4.4",
  "scipy==1.17.1",
  "matplotlib==3.10.8",
  "ordered-set==4.1.0",
  "ortools==9.15.6755",
]

[project.optional-dependencies]
dev = [
  "black==26.3.1",
  "flake8==7.3.0",
  "Flake8-pyproject==1.2.4",
  "mypy==1.20.1",
  "pytest==9.0.2",
  "nbformat==5.10.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mht*"]

[tool.black]
target-version = ['py312']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.flake8]
max-line-length = 88
# E203: whitespace before ':'
# E501: line too long
# E741: ambigous variable name 'I', 'O' or 'l'
# W503: line break before binary operator
extend-ignore = ['E203', 'E501', 'E741', 'W503']
exclude = [".git", "venv", "build"]

[tool.mypy]
[[tool.mypy.overrides]]
module = ["matplotlib.*", "scipy.*", "stonesoup.*"]
ignore_missing_imports = true
